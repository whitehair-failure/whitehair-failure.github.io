  <path d="M 256 470 C 130 380, 0 300, 0 160 C 0 80, 80 0, 180 0 C 215 0, 240 20, 256 50 C 272 20, 297 0, 332 0 C 432 0, 512 80, 512 160 C 512 300, 382 380, 256 470 Z"
